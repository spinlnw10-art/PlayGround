<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hi — PlayGround</title>
<meta name="description" content="A friendly little static site that just says hi." />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 20% 10%, #dbeafe 0%, transparent 60%),
                radial-gradient(1000px 600px at 90% 90%, #fce7f3 0%, transparent 55%),
                #f8fafc;
    color: #0f172a;
    padding: 24px;
  }
  main {
    max-width: 640px;
    width: 100%;
    background: rgba(255,255,255,.9);
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(15,23,42,.12);
  }
  .pill {
    display: inline-block;
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #475569;
    border: 1px solid #e2e8f0;
    background: #f1f5f9;
    padding: 6px 12px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  h1 { font-size: clamp(48px, 8vw, 84px); margin: 0 0 12px; letter-spacing: -0.03em; }
  p { margin: 0 0 12px; font-size: 18px; line-height: 1.6; color: #334155; }
  .row { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
  button, a.btn {
    font: inherit;
    cursor: pointer;
    border-radius: 12px;
    padding: 12px 20px;
    border: 1px solid #0f172a;
    text-decoration: none;
    display: inline-block;
  }
  button.primary { background: #0f172a; color: #fff; }
  a.btn { background: #fff; color: #0f172a; }
  #count { font-variant-numeric: tabular-nums; font-weight: 700; }
  footer { margin-top: 28px; font-size: 13px; color: #64748b; }
  @media (prefers-color-scheme: dark) {
    body { background: #020617; color: #e2e8f0; }
    main { background: rgba(15,23,42,.9); border-color: #1e293b; }
    .pill { background: #0f172a; border-color: #1e293b; color: #94a3b8; }
    p { color: #94a3b8; }
    button.primary { background: #e2e8f0; color: #020617; border-color: #e2e8f0; }
    a.btn { background: transparent; color: #e2e8f0; border-color: #334155; }
    footer { color: #475569; }
  }
</style>
</head>
<body>
<main>
  <span class="pill">PlayGround &middot; static site</span>
  <h1>Hi there &#128075;</h1>
  <p>This tiny website is alive and rendering. No build step, no framework — just HTML, CSS, and a sprinkle of JavaScript.</p>
  <p>You have pressed the button <span id="count">0</span> times.</p>
  <div class="row">
    <button class="primary" id="hi" type="button">Say hi back</button>
    <a class="btn" href="#hi">Anchor link</a>
  </div>
  <footer>Served as static files from <code>dist/</code> on port 3000.</footer>
</main>
<script>
  (function () {
    var n = 0;
    var el = document.getElementById('count');
    document.getElementById('hi').addEventListener('click', function () {
      n += 1;
      el.textContent = String(n);
    });
  })();
</script>
</body>
</html>
